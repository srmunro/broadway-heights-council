    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2C5C7A;
      --blue-dark: #1e4258;
      --blue-light: #3a7199;
      --gold: #E8B84F;
      --gold-dark: #d4a63a;
      --brown: #A45F53;
      --cream: #F9F7F4;
      --cream-dark: #efe9e1;
      --text: #2a2a2a;
      --text-light: #6b6b6b;
      --white: #ffffff;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.12);
      --radius: 12px;
      --transition: 0.3s ease;
    }
    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .site-header {
      background: var(--blue);
      color: var(--white);
      padding: 1.5rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .site-header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .site-header h1 a {
      color: var(--white);
      text-decoration: none;
    }
    .site-header nav a {
      color: var(--cream);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      margin-left: 1.5rem;
      transition: color var(--transition);
    }
    .site-header nav a:hover { color: var(--gold); }
    .site-header nav a.active { color: var(--gold); text-decoration: underline; }

    /* ===== Page Title ===== */
    .page-title {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: var(--white);
      text-align: center;
      padding: 3rem 2rem 2rem;
    }
    .page-title h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .page-title p {
      margin-top: 0.5rem;
      font-size: 1.05rem;
      opacity: 0.85;
    }

    /* ===== Tabs ===== */
    .tabs-container {
      max-width: 1100px;
      margin: -1.5rem auto 0;
      padding: 0 2rem;
      position: relative;
      z-index: 10;
    }
    .tabs {
      display: flex;
      gap: 0;
      background: var(--white);
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .tab {
      flex: 1;
      padding: 1.1rem 2rem;
      background: transparent;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: all var(--transition);
      border-bottom: 3px solid transparent;
      position: relative;
    }
    .tab:hover { color: var(--blue); background: var(--cream); }
    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--gold);
      background: var(--white);
    }
    .tab .badge {
      display: inline-block;
      background: var(--blue);
      color: var(--white);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 100px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    .tab.active .badge { background: var(--gold); color: var(--text); }

    /* ===== Events Container ===== */
    .events-panel {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
      display: none;
    }
    .events-panel.active { display: block; }
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    /* ===== Event Card ===== */
    .event-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition);
      display: flex;
      flex-direction: column;
    }
    .event-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .event-card .date-bar {
      background: var(--blue);
      color: var(--white);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .event-card .date-bar .day {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
    }
    .event-card .date-bar .month {

      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }
    .event-card .date-bar .year {

      opacity: 0.7;
      margin-left: auto;
    }
    .event-card .card-body {

      display: flex;
      flex-direction: column;
    }
    .event-card h3 {

      font-size: 1.15rem;
      font-weight: 600;
      color: var(--blue-dark);
      margin-bottom: 0.5rem;

      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .event-card .meta svg {

      height: 14px;
      flex-shrink: 0;

    .event-card .description {

      color: var(--text);
      margin: 0.75rem 0;
      flex: 1;
    }
    .event-card .details-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color var(--transition);
      margin-top: auto;
    }
    .event-card .details-link:hover { color: var(--gold-dark); }
    .event-card .card-actions {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

      font-weight: 700;
      font-size: 0.9rem;

    .archived .event-card {

    }

    }
    .archived .event-card h3 {

      font-weight: 700;

    .site-footer {

      color: var(--cream);
      text-align: center;
      padding: 2rem;
      margin-top: 3rem;
      font-size: 0.9rem;

      .events-panel { padding: 1.5rem 1rem; }
      .events-grid { grid-template-columns: 1fr; }
    }

    // ===== Helpers =====
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthFull = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return { year: y, month: m, day: d, monthName: monthNames[m-1], monthFull: monthFull[m-1] };
    }

    function formatDate(dateStr) {
      const dt = parseDate(dateStr);
      return `${dt.monthFull} ${dt.day}, ${dt.year}`;
    }

    // Icon SVGs
    const iconClock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    const iconPin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
    const iconArrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

    // ===== Render Event Card =====
    function renderCard(evt) {
      const dt = parseDate(evt.date);
      const isMultiDay = evt.end_date && evt.end_date !== evt.date;
      let dateLabel = `${dt.monthName} ${dt.day}`;
      if (isMultiDay) {
        const endDt = parseDate(evt.end_date);
        dateLabel = `${dt.monthName} ${dt.day}–${endDt.monthName} ${endDt.day}`;
      }
      const virtualBadge = evt.virtual ? '<span class="virtual-badge">Virtual</span>' : '';
      const venueLine = evt.venue && evt.venue !== 'Virtual'
        ? `${evt.venue} &middot; ${evt.location}`
        : evt.location;

      const rsvpLink = evt.rsvpId
        ? `<a class="rsvp-btn-card" href="register.html?event=${evt.rsvpId}">Sign Up</a>`
        : '';
      const detailsLink = evt.detailPage
        ? `<a class="details-link" href="${evt.detailPage}">View Details ${iconArrow}</a>`
        : '';

      return `
        <div class="event-card">
          <div class="date-bar">
            <div>
              <div class="day">${dt.day}</div>
              <div class="month">${dt.monthName}</div>
            </div>
            <div class="year">${dt.year}</div>
          </div>
          <div class="card-body">
            <h3>${evt.title}${virtualBadge}</h3>
            <div class="meta">${iconClock} ${evt.time}${isMultiDay ? ' (2-day event)' : ''}</div>
            <div class="meta">${iconPin} ${venueLine}</div>
            <p class="description">${evt.description}</p>
            <div class="card-actions">
              ${detailsLink}
              ${rsvpLink}
            </div>
          </div>
        </div>
      `;
    }

    // ===== Sort Events =====
    function sortEvents(list) {
      return list.sort((a, b) => {
        const da = a.date + a.time_sort;
        const db = b.date + b.time_sort;
        return db.localeCompare(da); // newest first
      });
    }

    // ===== Initialize =====
    const upcoming = sortEvents(events.filter(e => e.status === 'upcoming'));
    const archive = sortEvents(events.filter(e => e.status === 'past'));

    document.getElementById('upcoming-count').textContent = upcoming.length;
    document.getElementById('archive-count').textContent = archive.length;

    const gridUpcoming = document.getElementById('grid-upcoming');
    const gridArchive = document.getElementById('grid-archive');

    if (upcoming.length > 0) {
      gridUpcoming.innerHTML = upcoming.map(renderCard).join('');
    } else {
      gridUpcoming.innerHTML = '<div class="empty-state"><h3>No upcoming events</h3><p>Check back soon — new events are being planned!</p></div>';
    }

    if (archive.length > 0) {
      gridArchive.innerHTML = archive.map(renderCard).join('');
    } else {
      gridArchive.innerHTML = '<div class="empty-state"><h3>Archive is empty</h3><p>Past events will appear here.</p></div>';
    }

    // ===== Tab Switching =====
    function switchTab(tab) {
      // Update tab buttons
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');

      // Update panels
      document.querySelectorAll('.events-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');

      // Add archived class for styling
      const container = document.getElementById('panel-' + tab);
      if (tab === 'archive') {
        container.classList.add('archived');
      } else {
        container.classList.remove('archived');
      }
    }
  </script>
</body>
</html>
